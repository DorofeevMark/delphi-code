[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-code"
version = "0.1.1"
description = "Offline local code search for agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Mark Dorofeev" }]
keywords = ["code-search", "semantic-search", "embeddings", "offline", "cli", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "cocoindex==1.0.24",
  "sqlite-vec==0.1.9",
  "sentence-transformers==6.1.0",
  "numpy==2.5.3",
  "pathspec==0.12.1",
  "questionary==2.1.1",
  "certifi",
]

[project.urls]
Repository = "https://github.com/DorofeevMark/delphi-code"
Issues = "https://github.com/DorofeevMark/delphi-code/issues"

[project.scripts]
delphi-code = "delphi_code.cli:main"

[tool.setuptools.packages.find]
include = ["delphi_code*"]

[tool.setuptools.package-data]
delphi_code = ["model_provenance.json"]
