[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-code"
version = "0.2.2"
description = "Offline local code search for agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Mark Dorofeev" }]
keywords = ["code-search", "semantic-search", "embeddings", "offline", "cli", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "cocoindex==1.0.24",
  "sqlite-vec==0.1.9",
  "sentence-transformers==6.1.0",
  "numpy==2.5.3",
  "pathspec==0.12.1",
  "questionary==2.1.1",
  "certifi",
]

[project.urls]
Repository = "https://github.com/DorofeevMark/delphi-code"
Issues = "https://github.com/DorofeevMark/delphi-code/issues"

[project.scripts]
delphi-code = "delphi_code.cli:main"

[tool.setuptools.packages.find]
include = ["delphi_code*"]

[tool.setuptools.package-data]
delphi_code = ["model_provenance.json"]

[dependency-groups]
dev = ["ruff==0.16.9", "pyright==1.1.414"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pyright]
include = ["delphi_code"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
