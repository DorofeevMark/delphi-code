name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match package version'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  verify:
    needs: build
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Install release wheel with dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} --managed-python .venv
          uv pip install dist/*.whl
      - name: Lint and type-check
        run: |
          uv pip install --group dev
          bash scripts/lint.sh
      - name: Download and validate model
        env:
          DELPHI_CODE_MODEL: ${{ runner.temp }}/delphi-code-model
          DELPHI_CODE_INDEX_ROOT: ${{ runner.temp }}/delphi-code-indexes
        run: .venv/bin/delphi-code setup
      - name: Run unit and offline integration tests
        env:
          DELPHI_CODE_TEST_MODEL: ${{ runner.temp }}/delphi-code-model
        run: |
          bash scripts/test.sh
          bash scripts/test_offline.sh
      - name: Verify installed package outside checkout
        env:
          DELPHI_CODE_MODEL: ${{ runner.temp }}/delphi-code-model
          DELPHI_CODE_INDEX_ROOT: ${{ runner.temp }}/delphi-code-smoke-indexes
        run: |
          executable="$GITHUB_WORKSPACE/.venv/bin/delphi-code"
          cd "$RUNNER_TEMP"
          mkdir smoke-project
          echo 'def authenticate_user(password, expected): return password == expected' > smoke-project/auth.py
          "$executable" index -p "$RUNNER_TEMP/smoke-project"
          "$executable" search -p "$RUNNER_TEMP/smoke-project" 'verify password' --limit 1 > search.json
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('search.json').read_text())
          assert result['ok'] and result['data']['results'][0]['path'] == 'auth.py'
          PY

  verify-install-script:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Pin the install script to the built version
        run: |
          wheel=$(ls dist/delphi_code-*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "DELPHI_CODE_BUILT_VERSION=$version" >> "$GITHUB_ENV"
          mkdir release-assets
          sed "s/^DELPHI_CODE_RELEASE_VERSION=\"\"$/DELPHI_CODE_RELEASE_VERSION=\"$version\"/" scripts/install.sh > release-assets/install.sh
          grep -qx "DELPHI_CODE_RELEASE_VERSION=\"$version\"" release-assets/install.sh
      - name: Install the built wheel with the script on a machine without uv
        run: |
          clean_home="$RUNNER_TEMP/clean-home"
          mkdir "$clean_home"
          echo "DELPHI_CODE_CLEAN_HOME=$clean_home" >> "$GITHUB_ENV"
          env -i HOME="$clean_home" PATH=/usr/bin:/bin:/usr/sbin:/sbin UV_FIND_LINKS="$GITHUB_WORKSPACE/dist" \
            sh -s < release-assets/install.sh
      - name: Check version, index, search and doctor
        run: |
          run_installed() {
            env -i HOME="$DELPHI_CODE_CLEAN_HOME" PATH=/usr/bin:/bin "$DELPHI_CODE_CLEAN_HOME/.local/bin/delphi-code" "$@"
          }
          test "$(run_installed --version)" = "delphi-code $DELPHI_CODE_BUILT_VERSION"
          mkdir "$RUNNER_TEMP/smoke-project"
          echo 'def authenticate_user(password, expected): return password == expected' > "$RUNNER_TEMP/smoke-project/auth.py"
          run_installed index -p "$RUNNER_TEMP/smoke-project" --json
          run_installed search -p "$RUNNER_TEMP/smoke-project" 'verify password' --limit 1 --json > search.json
          python3 -c "import json; r = json.load(open('search.json')); assert r['ok'] and r['data']['results'][0]['path'] == 'auth.py', r"
          run_installed doctor -p "$RUNNER_TEMP/smoke-project" --json
      - uses: actions/upload-artifact@v7
        with:
          name: install-script
          path: release-assets/install.sh
          if-no-files-found: error

  publish:
    needs: [build, verify, verify-install-script]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/delphi-code/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: install-script
          path: release-assets
      - name: Write release notes from commits since the previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" \
            | grep -vE '^- (Bump version|GitButler)' > notes.md || true
          if [ -n "$previous" ]; then
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* release-assets/install.sh --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
